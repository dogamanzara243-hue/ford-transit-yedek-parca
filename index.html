<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="google-site-verification" content="EbM3u3bYpOZ58TpbeiGva_K3TF_zjo3MGmcGtYSd0nI" />
    <title>TRANSİT PARÇA DÜNYASI | Ford Transit Sıfır ve İkinci El Orijinal & Muadil Yedek Parça Tedariki</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="flex flex-col min-h-screen">
    
    <div id="ust-reklam-alani"></div>
    <header class="bg-ana text-white sticky top-0 z-50 shadow-lg">
        <div class="max-w-7xl mx-auto px-4 py-4 flex flex-wrap items-center justify-between gap-4">
            <a href="index.html" class="flex items-center gap-3">
                <div class="w-11 h-11 rounded-xl bg-vurgu flex items-center justify-center text-white text-xl shadow">
                    <i id="header-ikon" class="fa-solid fa-truck-fast"></i>
                </div>
                <div>
                    <h1 id="header-baslik" class="font-extrabold text-lg md:text-xl">Yükleniyor...</h1>
                    <p id="header-slogan" class="text-xs text-slate-300 hidden sm:block"></p>
                </div>
            </a>
            <div id="ust-butonlar-alani" class="flex flex-wrap items-center gap-2"></div>
        </div>
    </header>
    
    <section class="bg-slate-900 text-white py-12 px-4 text-center">
        <div class="max-w-2xl mx-auto">
            <h2 class="text-2xl md:text-3xl font-extrabold mb-4">Ford Transit Parça Arama</h2>
            <input type="text" id="arama-input" placeholder="Parça adı veya OEM kodu yazın..." class="w-full px-4 py-3 rounded-xl text-slate-900 font-medium">
        </div>
    </section>
    <main class="max-w-7xl mx-auto px-4 py-10 flex-grow w-full">
        <section id="ilanlar-vitrin" class="mb-14">
            <h2 class="text-2xl font-extrabold text-ana mb-6"><i class="fa-solid fa-fire text-vurgu"></i> Öne Çıkan İlanlar</h2>
            <div id="one-cikan-ilanlar-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6"></div>
        </section>
        <div id="ara-reklam-alani"></div>
        <section id="kategoriler-bolumu" class="mt-10">
            <h2 class="text-2xl font-extrabold text-ana mb-6"><i class="fa-solid fa-layer-group text-vurgu"></i> Kategoriler</h2>
            <div id="kategoriler-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6"></div>
        </section>
    </main>
    
    <div id="alt-reklam-alani" class="max-w-7xl mx-auto px-4 my-10"></div>
    <footer class="bg-ana text-slate-300 pt-12 pb-8 mt-12 border-t border-slate-800">
        <div class="max-w-7xl mx-auto px-4 grid grid-cols-1 md:grid-cols-3 gap-8">
            <div>
                <h3 id="footer-baslik" class="text-white font-bold text-lg mb-3"></h3>
                <p id="footer-hakkimizda" class="text-sm text-slate-400"></p>
            </div>
            <div>
                <h4 class="text-white font-bold text-base mb-3">Hızlı Kategoriler</h4>
                <ul id="footer-kategoriler" class="space-y-2 text-sm"></ul>
            </div>
            <div>
                <h4 class="text-white font-bold text-base mb-3">İletişim</h4>
                <p class="text-sm mb-2"><i class="fa-solid fa-location-dot text-vurgu mr-2"></i><span id="footer-adres"></span></p>
                <p class="text-sm mb-2"><i class="fa-solid fa-phone text-vurgu mr-2"></i><span id="footer-tel"></span></p>
                <div id="footer-sosyal" class="flex flex-wrap gap-2 mt-3"></div>
            </div>
        </div>
    </footer>
    
    <script src="js/app.js"></script>
</body>
</html>
